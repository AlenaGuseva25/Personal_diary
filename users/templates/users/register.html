{% extends "diary/base.html" %}

{% block content %}
<div class="auth-card">
    <h2 class="text-center mb-4">Регистрация</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100 mt-3">
            Зарегистрироваться
        </button>
    </form>
    <div class="text-center mt-3">
        Уже есть аккаунт? <a href="{% url 'users:login' %}">Войти</a>
    </div>
</div>
{% endblock %}
