{% extends "diary/base.html" %}

{% block content %}
<div class="auth-card">
    <h2 class="text-center mb-4">Вход в дневник</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100 mt-3">
            Войти
        </button>
    </form>
    <div class="text-center mt-3">
        Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрируйтесь</a>
    </div>
    <div class="text-center mt-2">
        <a href="{% url 'users:password_reset' %}">Забыли пароль?</a>
    </div>
</div>
{% endblock %}
