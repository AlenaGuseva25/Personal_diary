{% extends "diary/base.html" %}

{% block content %}
<div class="auth-card">
    <h2 class="text-center mb-4">Подтверждение</h2>
    <p class="text-center">Мы отправили 6-значный код на вашу почту</p>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="code" class="form-label">Код подтверждения</label>
            <input type="text" class="form-control" name="code" maxlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">
            Подтвердить
        </button>
    </form>
    
    <p class="text-muted small mt-3 text-center">
        Код действителен в течение 2 минут
    </p>
</div>
{% endblock %}
