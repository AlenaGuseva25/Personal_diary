{% extends "base.html" %}

{% block content %}
<div class="auth-card">
    <h2 class="text-center mb-4">Повторная отправка кода</h2>
    
    <div class="alert alert-success">
        <p>Новый код подтверждения был отправлен на вашу электронную почту.</p>
        <p class="mb-0">Пожалуйста, проверьте ваш email и введите код в форме подтверждения.</p>
    </div>
    
    <div class="text-center mt-4">
        <a href="{% url 'confirm' %}" class="btn btn-primary">
            Вернуться к форме подтверждения
        </a>
    </div>
</div>
{% endblock %}
