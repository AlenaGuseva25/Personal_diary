{% extends "diary/base.html" %}

{% block content %}
<div class="profile-container">
    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body text-center">
                    {% if user.avatar %}
                    <img src="{{ user.avatar.url }}" class="rounded-circle mb-3" width="150" height="150">
                    {% else %}
                    <div class="mb-3" style="width:150px; height:150px; background:#eee; border-radius:50%; margin:0 auto;"></div>
                    {% endif %}
                    <h3>{{ user.get_full_name|default:user.email }}</h3>
                    <p class="text-muted">{{ user.email }}</p>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Редактирование профиля</h4>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary mt-3">
                            Сохранить изменения
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
