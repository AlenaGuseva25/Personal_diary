{% extends "diary/base.html" %}

{% block content %}
<div class="diary-container">
    <div class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-3">
                <h2 style="color: #2c3e50;">{{ diary_entry.title }}</h2>
                <small class="text-muted">{{ diary_entry.created_at|date:"d.m.Y H:i" }}</small>
            </div>

            {% if diary_entry.picture %}
            <div class="mb-4">
                <img src="{{ diary_entry.picture.url }}" alt="{{ diary_entry.title }}" class="img-fluid rounded">
            </div>
            {% endif %}

            <div class="mb-4">
                <p style="line-height: 1.6; white-space: pre-line;">{{ diary_entry.content }}</p>
            </div>

            <div class="d-flex justify-content-between">
                <a href="{% url 'diary:diary_list' %}" class="btn btn-outline-secondary">← Назад к списку</a>
                <div>
                    <a href="{% url 'diary:update' diary_entry.pk %}" class="btn btn-outline-primary me-2">Редактировать</a>
                    <a href="{% url 'diary:delete' diary_entry.pk %}" class="btn btn-outline-danger">Удалить</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
