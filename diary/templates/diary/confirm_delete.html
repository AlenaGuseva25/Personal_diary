{% extends "diary/base.html" %}

{% block content %}
<div class="content-card">
    <h2 class="mb-4 text-dark">Подтверждение удаления</h2>

    <div class="alert alert-light border mb-4">
        <h5 class="text-dark">Вы уверены, что хотите удалить запись?</h5>
        <p class="mb-0 text-secondary">"{{ object.title }}" от {{ object.created_at|date:"d.m.Y" }}</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-between">
            <a href="{% url 'diary:detail' object.pk %}" class="btn btn-outline-secondary">Отмена</a>
            <button type="submit" class="btn btn-danger">Удалить навсегда</button>
        </div>
    </form>
</div>
{% endblock %}
