{% extends "diary/base.html" %}

{% block content %}
<div class="diary-container">
    <div class="card">
        <div class="card-body">
            <h2 class="mb-4" style="color: #2c3e50;">Подтверждение удаления</h2>

            <div class="alert alert-light border mb-4">
                <h5>Вы уверены, что хотите удалить запись?</h5>
                <p class="mb-0 text-muted">"{{ object.title }}" от {{ object.created_at|date:"d.m.Y" }}</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-between">
                    <a href="{% url 'diary:detail' object.pk %}" class="btn btn-outline-secondary">Отмена</a>
                    <button type="submit" class="btn btn-danger">Удалить навсегда</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
